name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          set +e
          npm run lint > eslint-output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat eslint-output.txt
          exit 0

      - name: Run Prettier check
        id: prettier
        continue-on-error: true
        run: |
          set +e
          if npx --no-install prettier --version >/dev/null 2>&1; then
            npx --no-install prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" > prettier-output.txt 2>&1
          else
            npx prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" > prettier-output.txt 2>&1 || true
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat prettier-output.txt || true
          exit 0

      - name: Post code quality PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return 'No output captured.'; }
            };
            const eslintOut = readSafe('eslint-output.txt');
            const prettierOut = readSafe('prettier-output.txt');
            const eslintExit = '${{ steps.eslint.outputs.exit_code }}';
            const prettierExit = '${{ steps.prettier.outputs.exit_code }}';
            const eslintStatus = eslintExit === '0' ? '✅ Passed' : '⚠️ Issues found';
            const prettierStatus = prettierExit === '0' ? '✅ Passed' : '⚠️ Issues found';
            const body = [
              '## 🧹 Code Quality Report',
              '',
              `- **ESLint**: ${eslintStatus}`,
              `- **Prettier**: ${prettierStatus}`,
              '',
              '<details><summary>ESLint output</summary>',
              '',
              '```',
              eslintOut,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Prettier output</summary>',
              '',
              '```',
              prettierOut,
              '```',
              '',
              '</details>'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test > test-output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat test-output.txt
          exit 0

      - name: Generate coverage report
        id: coverage
        continue-on-error: true
        run: |
          set +e
          mkdir -p coverage
          if npm run | grep -qE "^\s+coverage"; then
            npm run coverage > coverage-output.txt 2>&1
          else
            npx --yes nyc --reporter=text --reporter=lcov --reporter=html npm test > coverage-output.txt 2>&1 || true
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat coverage-output.txt || true
          exit 0

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-output.txt
            test-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Post test coverage PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return 'No output captured.'; }
            };
            const testOut = readSafe('test-output.txt');
            const coverageOut = readSafe('coverage-output.txt');
            const testExit = '${{ steps.tests.outputs.exit_code }}';
            const testStatus = testExit === '0' ? '✅ All tests passed' : '⚠️ Some tests failed';
            const body = [
              '## 🧪 Test Coverage Report',
              '',
              `- **Test suite**: ${testStatus}`,
              `- **Coverage**: report uploaded as artifact \`coverage-report\``,
              '',
              '<details><summary>Test output</summary>',
              '',
              '```',
              testOut,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Coverage output</summary>',
              '',
              '```',
              coverageOut,
              '```',
              '',
              '</details>'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run dependency vulnerability audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --json > audit.json 2>&1 || true
          npm audit > audit.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat audit.txt || true
          exit 0

      - name: Scan for secrets in changes
        id: secrets
        continue-on-error: true
        run: |
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          {
            echo "Scanning diff between $BASE_SHA and $HEAD_SHA";
            git diff "$BASE_SHA" "$HEAD_SHA" -- . > changes.diff 2>/dev/null || git diff HEAD~1 HEAD > changes.diff 2>/dev/null || true;
            grep -E -nI "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_\-]{35}|ghp_[A-Za-z0-9]{36}|xox[abpsr]-[A-Za-z0-9-]+|-----BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY-----|secret[_-]?key|api[_-]?key|password\s*[:=])" changes.diff || echo "No obvious secrets detected.";
          } > secrets-scan.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat secrets-scan.txt
          exit 0

      - name: Post security scan PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return 'No output captured.'; }
            };
            const auditOut = readSafe('audit.txt');
            const secretsOut = readSafe('secrets-scan.txt');
            let vulnSummary = 'See audit output below.';
            try {
              const auditJson = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
              if (auditJson.metadata && auditJson.metadata.vulnerabilities) {
                const v = auditJson.metadata.vulnerabilities;
                vulnSummary = `info: ${v.info||0}, low: ${v.low||0}, moderate: ${v.moderate||0}, high: ${v.high||0}, critical: ${v.critical||0}`;
              }
            } catch (e) { /* ignore */ }
            const body = [
              '## 🔒 Security Scan Report',
              '',
              '### Dependencies',
              `- **Vulnerabilities**: ${vulnSummary}`,
              '',
              '### Secret scanning',
              '- Scanned PR diff for common secret patterns.',
              '',
              '<details><summary>npm audit output</summary>',
              '',
              '```',
              auditOut,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Secret scan output</summary>',
              '',
              '```',
              secretsOut,
              '```',
              '',
              '</details>'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set +e
          mkdir -p build-artifacts
          if npm run | grep -qE "^\s+build"; then
            npm run build > build-output.txt 2>&1
          else
            echo "No build script defined; performing syntax validation." > build-output.txt
            node --check $(git ls-files '*.js' | head -50) >> build-output.txt 2>&1 || true
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat build-output.txt
          exit 0

      - name: Validate endpoints
        id: endpoints
        continue-on-error: true
        run: |
          set +e
          {
            echo "Starting application for endpoint validation...";
            (npm start &) > server.log 2>&1
            SERVER_PID=$!
            sleep 5
            for endpoint in / /health /api /status; do
              echo "--- GET http://localhost:3000$endpoint ---";
              curl -sS -o /dev/null -w "HTTP %{http_code}
" "http://localhost:3000$endpoint" || echo "endpoint $endpoint not reachable";
            done
            kill $SERVER_PID 2>/dev/null || true
          } > endpoints.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat endpoints.txt
          exit 0

      - name: Create deployment preview artifacts
        run: |
          mkdir -p deployment-preview
          cp -r build-artifacts/* deployment-preview/ 2>/dev/null || true
          cp build-output.txt deployment-preview/ 2>/dev/null || true
          cp endpoints.txt deployment-preview/ 2>/dev/null || true
          echo "PR #${{ github.event.pull_request.number }} preview generated at $(date -u)" > deployment-preview/PREVIEW.md

      - name: Upload deployment preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-preview
          path: deployment-preview/
          if-no-files-found: ignore
          retention-days: 14

      - name: Post build validation PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 5000); }
              catch (e) { return 'No output captured.'; }
            };
            const buildOut = readSafe('build-output.txt');
            const endpointsOut = readSafe('endpoints.txt');
            const buildExit = '${{ steps.build.outputs.exit_code }}';
            const buildStatus = buildExit === '0' ? '✅ Build succeeded' : '⚠️ Build issues';
            const body = [
              '## 🏗️ Build Validation',
              '',
              `- **Build status**: ${buildStatus}`,
              '- **Endpoints**: validation attempted (see details below)',
              '- **Deployment preview**: uploaded as artifact `deployment-preview`',
              '',
              '<details><summary>Build output</summary>',
              '',
              '```',
              buildOut,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Endpoint validation</summary>',
              '',
              '```',
              endpointsOut,
              '```',
              '',
              '</details>'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
